name: APK bauen
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -q ITCS-Android-App.zip && cd ITCS-Android-App && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ITCS-App
          path: ITCS-Android-App/app/build/outputs/apk/release/*.apk
